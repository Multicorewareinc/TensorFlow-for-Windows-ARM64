
name: Build TensorFlow Windows ARM64 Wheel

on:
  workflow_dispatch:

jobs:
  build-windows-arm64:
    runs-on: [self-hosted, Windows, ARM64]

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Python 3.13
      # ------------------------------------------------------------
      - name: Set up Python 3.13
        shell: powershell
        run: |
          $python = "C:\Users\HCKTest\AppData\Local\Programs\Python\Python313-arm64"

          if (-not (Test-Path "$python\python.exe")) {
            $pythonExe = Get-ChildItem `
              "C:\hostedtoolcache\windows\Python" `
              -Recurse `
              -Filter python.exe `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match "3\.13.*\\arm64\\python\.exe$"
              } |
              Select-Object -First 1

            if (-not $pythonExe) {
              throw "Python 3.13 ARM64 was not found."
            }

            $python = Split-Path $pythonExe.FullName
          }

          Add-Content $env:GITHUB_PATH $python
          Add-Content $env:GITHUB_PATH "$python\Scripts"

          Write-Host "Python:"
          & "$python\python.exe" --version
          & "$python\python.exe" -c "import platform; print(platform.machine())"

      # ------------------------------------------------------------
      # Bazel 7.7.0 ARM64
      # ------------------------------------------------------------
      - name: Install Bazel 7.7.0
        shell: powershell
        run: |
          $bazelDir = "C:\tools\bazel"
          $bazelExe = "$bazelDir\bazel.exe"
          $url = "https://github.com/bazelbuild/bazel/releases/download/7.7.0/bazel-7.7.0-windows-arm64.exe"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $bazelDir | Out-Null

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $bazelExe

          Add-Content $env:GITHUB_PATH $bazelDir

          Write-Host "Bazel:"
          & $bazelExe --version

      # ------------------------------------------------------------
      # LLVM 21.1.8
      # ------------------------------------------------------------
      - name: Install LLVM 21.1.8
        shell: powershell
        run: |
          $installer = "$env:RUNNER_TEMP\LLVM-21.1.8-woa64.exe"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/LLVM-21.1.8-woa64.exe"
          $installDir = "C:\Program Files\LLVM"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Write-Host "Installing LLVM 21.1.8..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/S", "/D=$installDir" `
            -Wait `
            -NoNewWindow

          if (-not (Test-Path "$installDir\bin\clang.exe")) {
            throw "LLVM installation failed: clang.exe not found."
          }

          # Put our LLVM first for this step.
          $env:Path = "$installDir\bin;$env:Path"

          # Persist LLVM for subsequent steps.
          Add-Content $env:GITHUB_PATH "$installDir\bin"

          Write-Host "LLVM:"
          & "$installDir\bin\clang.exe" --version

      # ------------------------------------------------------------
      # Configure MSYS2 + Python
      # ------------------------------------------------------------
      - name: Configure MSYS2 and Python
        shell: powershell
        run: |
          # Make MSYS2 bash available.
          $env:Path += ";C:\tools\msys64\usr\bin"

          Add-Content $env:GITHUB_PATH "C:\tools\msys64\usr\bin"

          # Locate the installed Python 3.13 ARM64.
          $pythonExe = (Get-Command python.exe).Source
          $pythonDir = Split-Path $pythonExe
          $python3Exe = Join-Path $pythonDir "python3.exe"

          Write-Host "Python installation directory:"
          Write-Host $pythonDir

          # Copy python.exe -> python3.exe in the same installation directory.
          # The hosted runner may already have python3.exe.
          # Remove it first if possible.
          if (Test-Path $python3Exe) {
            try {
              Remove-Item $python3Exe -Force -ErrorAction Stop
            }
            catch {
              Write-Host "Existing python3.exe is locked; keeping the existing file."
            }
          }

          if (-not (Test-Path $python3Exe)) {
            Copy-Item `
              -Path $pythonExe `
              -Destination $python3Exe `
              -Force
          }

          Write-Host "Python:"
          python --version
          python3 --version

          Write-Host "Bash:"
          & "C:\tools\msys64\usr\bin\bash.exe" --version

          Write-Host "LLVM:"
          clang --version

      # ------------------------------------------------------------
      # Verify environment
      # ------------------------------------------------------------
      - name: Verify build environment
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Architecture"
          Write-Host "========================================"

          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "64-bit OS=$([System.Environment]::Is64BitOperatingSystem)"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Python"
          Write-Host "========================================"

          python --version
          python3 --version
          python -c "import sys, platform; print(sys.executable); print(platform.machine())"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Bazel"
          Write-Host "========================================"

          bazel --version

          Write-Host ""
          Write-Host "========================================"
          Write-Host "LLVM"
          Write-Host "========================================"

          Get-Command clang -All
          clang --version

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Bash"
          Write-Host "========================================"

          Get-Command bash -All
          & "C:\tools\msys64\usr\bin\bash.exe" --version

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Git"
          Write-Host "========================================"

          git --version

      # ------------------------------------------------------------
      # Build TensorFlow wheel
      # ------------------------------------------------------------
      - name: Build TensorFlow wheel
        shell: powershell
        env:
          HERMETIC_PYTHON_VERSION: "3.13"
          TF_PYTHON_VERSION: "3.13"
        run: |
          # Make MSYS2 bash available to TensorFlow repository rules.
          $env:Path += ";C:\tools\msys64\usr\bin"

          bazel --output_base=C:\_bzl build `
            --config=release_cpu_windows_arm64 `
            --action_env=PATH="$env:Path" `
            --repo_env=HERMETIC_PYTHON_VERSION=3.13 `
            --repo_env=TF_PYTHON_VERSION=3.13 `
            //tensorflow/tools/pip_package:wheel `
            --verbose_failures

      # ------------------------------------------------------------
      # Verify wheel
      # ------------------------------------------------------------
      - name: Verify generated wheel
        shell: powershell
        run: |
          $wheelDir = "bazel-bin\tensorflow\tools\pip_package\wheel_house"

          if (-not (Test-Path $wheelDir)) {
            throw "Wheel directory was not generated: $wheelDir"
          }

          $wheels = Get-ChildItem `
            $wheelDir `
            -Filter "*.whl" `
            -Recurse

          if ($wheels.Count -eq 0) {
            throw "No wheel was generated."
          }

          Write-Host "Generated wheel(s):"

          foreach ($wheel in $wheels) {
            Write-Host $wheel.FullName
          }

      # ------------------------------------------------------------
      # Upload wheel artifact
      # ------------------------------------------------------------
      - name: Upload TensorFlow Windows ARM64 wheel
        uses: actions/upload-artifact@v4
        with:
          name: tensorflow-windows-arm64-wheel
          path: bazel-bin/tensorflow/tools/pip_package/wheel_house/*.whl
          if-no-files-found: error
          retention-days: 14
